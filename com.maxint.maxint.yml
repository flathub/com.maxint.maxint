# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

app-id: com.maxint.maxint
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: maxint
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
modules:
  - name: zenity
    buildsystem: meson
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/icons/hicolor
    cleanup:
      - /share/applications
      - /share/doc
      - /share/help
      - /share/icons
      - /share/man
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/zenity.git
        tag: 4.2.2
        commit: c0f30c18e55b6a0cf5c2deb1c7449debb79027dc
  - name: maxint
    buildsystem: simple
    build-commands:
      - install -Dm644 com.maxint.maxint.metainfo.xml /app/share/metainfo/com.maxint.maxint.metainfo.xml
      - install -Dm644 maxint/icon.png /app/share/icons/hicolor/512x512/apps/com.maxint.maxint.png
      - install -Dm644 com.maxint.maxint.desktop /app/share/applications/com.maxint.maxint.desktop
      - install -dm755 /app/bin /app/maxint
      - cp -R maxint/ /app
      - ln -s /app/maxint/maxint /app/bin/maxint
    sources:
      - type: archive
        dest: maxint
        url: https://github.com/maxint-app/builds/releases/download/2.24.0/Maxint-linux-x86_64.tar.xz
        sha256: 79ea73413641eafcd4e983561ad5c53121b2ba1cbcc9a1fa5711c400cfed7f38
      - type: file
        path: com.maxint.maxint.metainfo.xml
      - type: file
        path: com.maxint.maxint.desktop
